name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: myapp/.nvmrc
          cache: npm
          cache-dependency-path: myapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
